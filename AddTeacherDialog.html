<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .button-group {
      margin-top: 20px;
      text-align: right;
    }
    
    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-primary {
      background-color: #4285f4;
      color: white;
    }
    
    .btn-secondary {
      background-color: #ccc;
      color: #333;
    }
    
    .btn-primary:hover {
      background-color: #357ae8;
    }
    
    .message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      display: none;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div id="message" class="message"></div>
  
  <div class="form-group">
    <label for="teacherType">Teacher Type *</label>
    <select id="teacherType">
      <option value="NORMAL">Normal</option>
      <option value="INTERNSHIP">Internship</option>
      <option value="TRIAL">Trial</option>
      <option value="VIP">VIP</option>
      <option value="BASIC">Basic</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="teacherId">Teacher ID (Leave empty for auto-generation)</label>
    <input type="text" id="teacherId" placeholder="e.g., N01, Ti01, T01, V01, B01">
  </div>
  
  <div class="form-group">
    <label for="teacherName">Teacher Name *</label>
    <input type="text" id="teacherName" required>
  </div>
  
  <div class="form-group">
    <label for="teacherEmail">Email</label>
    <input type="email" id="teacherEmail">
  </div>
  
  <div class="form-group">
    <label for="teacherPhone">Phone</label>
    <input type="tel" id="teacherPhone">
  </div>
  
  <div class="form-group">
    <label for="availableFrom">Available From *</label>
    <input type="time" id="availableFrom" required>
  </div>
  
  <div class="form-group">
    <label for="availableTill">Available Till *</label>
    <input type="time" id="availableTill" required>
  </div>
  
  <div class="button-group">
    <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="btn-primary" onclick="submitForm()">Add Teacher</button>
  </div>
  
  <script>
    function submitForm() {
      const teacherData = {
        type: document.getElementById('teacherType').value,
        id: document.getElementById('teacherId').value || null,
        name: document.getElementById('teacherName').value,
        email: document.getElementById('teacherEmail').value,
        phone: document.getElementById('teacherPhone').value,
        availableFrom: document.getElementById('availableFrom').value,
        availableTill: document.getElementById('availableTill').value
      };
      
      if (!teacherData.name || !teacherData.availableFrom || !teacherData.availableTill) {
        showMessage('Please fill in all required fields', 'error');
        return;
      }
      
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .addTeacher(teacherData);
    }
    
    function onSuccess(teacherId) {
      showMessage('Teacher added successfully! ID: ' + teacherId, 'success');
      setTimeout(() => {
        google.script.host.close();
      }, 2000);
    }
    
    function onFailure(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
