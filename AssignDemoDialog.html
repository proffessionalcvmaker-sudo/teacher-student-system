<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .button-group {
      margin-top: 20px;
      text-align: right;
    }
    
    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-primary {
      background-color: #4285f4;
      color: white;
    }
    
    .btn-secondary {
      background-color: #ccc;
      color: #333;
    }
    
    .btn-primary:hover {
      background-color: #357ae8;
    }
    
    .message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      display: none;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .slots-container {
      display: flex;
      gap: 10px;
    }
    
    .slot-column {
      flex: 1;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }
    
    .slot-column.faded {
      opacity: 0.3;
      pointer-events: none;
    }
    
    .slot-item {
      padding: 5px;
      margin: 5px 0;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .slot-item:hover {
      background-color: #e3f2fd;
    }
    
    .slot-item.selected {
      background-color: #4285f4;
      color: white;
    }
  </style>
</head>
<body>
  <div id="message" class="message"></div>
  
  <div class="form-group">
    <label for="studentType">Student Type *</label>
    <select id="studentType" onchange="loadTeachers()">
      <option value="">Select Type</option>
      <option value="NORMAL">Normal</option>
      <option value="INTERNSHIP">Internship</option>
      <option value="TRIAL">Trial</option>
      <option value="VIP">VIP</option>
      <option value="BASIC">Basic</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="studentName">Student Name *</label>
    <input type="text" id="studentName" required>
  </div>
  
  <div class="form-group">
    <label for="studentEmail">Student Email</label>
    <input type="email" id="studentEmail">
  </div>
  
  <div class="form-group">
    <label for="studentPhone">Student Phone</label>
    <input type="tel" id="studentPhone">
  </div>
  
  <div class="form-group">
    <label for="teacherSelect">Select Teacher *</label>
    <select id="teacherSelect" onchange="loadTeacherSlots()">
      <option value="">Select a teacher</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="sessionType">Session Type *</label>
    <select id="sessionType">
      <option value="">Select Session Duration</option>
      <option value="30">30 minutes</option>
      <option value="40">40 minutes</option>
    </select>
  </div>
  
  <div id="slotsContainer" style="display: none;">
    <label>Available Time Slots</label>
    <div class="slots-container">
      <div class="slot-column" id="slots30">
        <h4>30 Minutes Slots</h4>
        <div id="slots30List"></div>
      </div>
      <div class="slot-column" id="slots40">
        <h4>40 Minutes Slots</h4>
        <div id="slots40List"></div>
      </div>
    </div>
  </div>
  
  <div class="form-group">
    <label for="notes">Notes</label>
    <input type="text" id="notes">
  </div>
  
  <div class="button-group">
    <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="btn-primary" onclick="submitForm()">Assign Demo</button>
  </div>
  
  <script>
    let selectedSlot = null;
    let selectedDuration = null;
    
    function loadTeachers() {
      const type = document.getElementById('studentType').value;
      const teacherSelect = document.getElementById('teacherSelect');
      
      teacherSelect.innerHTML = '<option value="">Loading...</option>';
      
      if (!type) {
        teacherSelect.innerHTML = '<option value="">Select a teacher</option>';
        return;
      }
      
      google.script.run
        .withSuccessHandler(populateTeachers)
        .withFailureHandler(onFailure)
        .getTeachersByType(type);
    }
    
    function populateTeachers(teachers) {
      const teacherSelect = document.getElementById('teacherSelect');
      teacherSelect.innerHTML = '<option value="">Select a teacher</option>';
      
      teachers.forEach(teacher => {
        const option = document.createElement('option');
        option.value = teacher.name;
        option.textContent = teacher.name + ' (' + teacher.id + ')';
        teacherSelect.appendChild(option);
      });
    }
    
    function loadTeacherSlots() {
      const teacherName = document.getElementById('teacherSelect').value;
      const sessionType = document.getElementById('sessionType').value;
      
      if (!teacherName) {
        document.getElementById('slotsContainer').style.display = 'none';
        return;
      }
      
      document.getElementById('slotsContainer').style.display = 'block';
      
      // Load both 30 and 40 minute slots
      google.script.run
        .withSuccessHandler((teacher) => displaySlots(teacher, 30))
        .withFailureHandler(onFailure)
        .findTeacherByName(teacherName);
      
      google.script.run
        .withSuccessHandler((teacher) => displaySlots(teacher, 40))
        .withFailureHandler(onFailure)
        .findTeacherByName(teacherName);
    }
    
    function displaySlots(teacher, duration) {
      if (!teacher) return;
      
      const slots = duration === 30 ? 
        teacher.slots30.split(', ') : 
        teacher.slots40.split(', ');
      
      const occupiedSlots = teacher.occupiedSlots ? 
        teacher.occupiedSlots.split(', ') : 
        [];
      
      const availableSlots = slots.filter(slot => !occupiedSlots.includes(slot));
      
      const listId = duration === 30 ? 'slots30List' : 'slots40List';
      const listElement = document.getElementById(listId);
      listElement.innerHTML = '';
      
      if (availableSlots.length === 0) {
        listElement.innerHTML = '<p>No slots available</p>';
        return;
      }
      
      availableSlots.forEach(slot => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.textContent = slot;
        div.onclick = () => selectSlot(slot, duration);
        listElement.appendChild(div);
      });
    }
    
    function selectSlot(slot, duration) {
      selectedSlot = slot;
      selectedDuration = duration;
      
      // Update session type dropdown
      document.getElementById('sessionType').value = duration;
      
      // Highlight selected slot
      const slots30List = document.getElementById('slots30List');
      const slots40List = document.getElementById('slots40List');
      
      Array.from(slots30List.children).forEach(el => el.classList.remove('selected'));
      Array.from(slots40List.children).forEach(el => el.classList.remove('selected'));
      
      event.target.classList.add('selected');
      
      // Fade the other column
      if (duration === 30) {
        document.getElementById('slots40').classList.add('faded');
        document.getElementById('slots30').classList.remove('faded');
      } else {
        document.getElementById('slots30').classList.add('faded');
        document.getElementById('slots40').classList.remove('faded');
      }
    }
    
    function submitForm() {
      const studentType = document.getElementById('studentType').value;
      const studentName = document.getElementById('studentName').value;
      const studentEmail = document.getElementById('studentEmail').value;
      const studentPhone = document.getElementById('studentPhone').value;
      const teacherName = document.getElementById('teacherSelect').value;
      const sessionType = document.getElementById('sessionType').value;
      const notes = document.getElementById('notes').value;
      
      if (!studentType || !studentName || !teacherName || !sessionType || !selectedSlot) {
        showMessage('Please fill in all required fields and select a time slot', 'error');
        return;
      }
      
      const demoData = {
        studentType: studentType,
        studentName: studentName,
        studentEmail: studentEmail,
        studentPhone: studentPhone,
        teacherName: teacherName,
        sessionType: sessionType + ' minutes',
        selectedSlot: selectedSlot,
        notes: notes
      };
      
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .assignDemo(demoData);
    }
    
    function onSuccess() {
      showMessage('Demo assigned successfully!', 'success');
      setTimeout(() => {
        google.script.host.close();
      }, 2000);
    }
    
    function onFailure(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
