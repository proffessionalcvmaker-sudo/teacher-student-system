<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    .button-group {
      margin-top: 20px;
      text-align: right;
    }
    
    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-danger {
      background-color: #dc3545;
      color: white;
    }
    
    .btn-secondary {
      background-color: #ccc;
      color: #333;
    }
    
    .btn-danger:hover {
      background-color: #c82333;
    }
    
    .warning {
      background-color: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    .message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
      display: none;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="warning">
    ⚠️ Warning: This action cannot be undone. Teachers with active students cannot be removed.
  </div>
  
  <div id="message" class="message"></div>
  
  <div class="form-group">
    <label for="teacherId">Teacher ID *</label>
    <input type="text" id="teacherId" placeholder="e.g., N01, Ti01, T01, V01, B01" required>
  </div>
  
  <div class="button-group">
    <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
    <button class="btn-danger" onclick="submitForm()">Remove Teacher</button>
  </div>
  
  <script>
    function submitForm() {
      const teacherId = document.getElementById('teacherId').value;
      
      if (!teacherId) {
        showMessage('Please enter a teacher ID', 'error');
        return;
      }
      
      if (!confirm('Are you sure you want to remove teacher ' + teacherId + '?')) {
        return;
      }
      
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .removeTeacher(teacherId);
    }
    
    function onSuccess() {
      showMessage('Teacher removed successfully!', 'success');
      setTimeout(() => {
        google.script.host.close();
      }, 2000);
    }
    
    function onFailure(error) {
      showMessage('Error: ' + error.message, 'error');
    }
    
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      messageDiv.style.display = 'block';
    }
  </script>
</body>
</html>
